<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 140" role="img" aria-labelledby="t1 t2">
  <title id="t1">Ký hiệu cổng logic OR hai ngõ vào A, B và một ngõ ra Y</title>
  <desc id="t2">Cạnh trái cong lõm vào với hai đường vào A và B, cạnh phải cong lồi, một đường ra Y ở giữa cạnh phải.</desc>
  <path d="M80 30 Q110 70 80 110 Q140 110 180 70 Q140 30 80 30 Z" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="40" y1="55" x2="82" y2="55" stroke="currentColor" stroke-width="2"/>
  <line x1="40" y1="85" x2="82" y2="85" stroke="currentColor" stroke-width="2"/>
  <line x1="180" y1="70" x2="230" y2="70" stroke="currentColor" stroke-width="2"/>
  <text x="24" y="59" font-size="12" fill="currentColor">A</text>
  <text x="24" y="89" font-size="12" fill="currentColor">B</text>
  <text x="238" y="74" font-size="12" fill="currentColor">Y</text>
  <text x="100" y="128" font-size="11" fill="currentColor">Cổng OR: Y = A + B</text>
</svg>
