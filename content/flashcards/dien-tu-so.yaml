- id: dtso-card-03
  topicId: dien-tu-so
  kind: formula
  front: 'Viết biểu thức logic của cổng NOT.'
  back: '$Y = \\overline{A}$ (đảo mức: vào 0 ra 1, vào 1 ra 0)'
- id: dtso-card-04
