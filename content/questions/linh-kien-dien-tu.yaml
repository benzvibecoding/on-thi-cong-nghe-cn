  subtopicId: linh-kien-thu-dong
  level: vd
  skill: compute
  stem: 'Đặt điện áp 5 V vào hai đầu điện trở 10 ôm. Dòng điện qua điện trở là bao nhiêu?'
  mcq:
    options:
      - '50 A'
      - '2 A'
      - '0,5 A'
      - '15 A'
    correct: C
  explanation: 'Đáp án C đúng: $I = U / R = 5 / 10 = 0{,}5$ A. A lấy 5 x 10. B lấy 10/5. D lấy 10 + 5.'
