- id: lkdt-tf4-01
  type: tf4
  topicId: linh-kien-dien-tu
  level: th
  stem: 'Cho các nhận định về linh kiện điện tử. Xét tính đúng/sai của từng ý.'
  tf4:
    statements:
      - key: a
        text: 'Điện trở có chức năng hạn chế dòng điện và chia điện áp.'
        isTrue: true
        explanation: 'Đúng theo định luật Ohm và ứng dụng chia áp.'
      - key: b
        text: 'Tụ điện chặn dòng một chiều và cho tín hiệu xoay chiều đi qua.'
        isTrue: true
        explanation: 'Đúng với tính chất cơ bản của tụ điện.'
      - key: c
        text: 'Mắc ngược diode trong mạch cần dẫn thuận thì mạch vẫn hoạt động bình thường.'
        isTrue: false
        explanation: 'Sai: diode phân cực ngược thì chặn dòng, mạch không hoạt động.'
      - key: d
        text: 'Transistor có thể dùng làm khóa điện tử hoặc khuếch đại tín hiệu.'
        isTrue: true
        explanation: 'Đúng: hai ứng dụng cơ bản của transistor.'
  explanation: 'Các ý a, b, d đúng; ý c sai.'
  source: { kind: original }
  status: draft
  version: 1
  tags: [seed, m2]
