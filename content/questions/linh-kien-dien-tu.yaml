  explanation: 'Đáp án B đúng: diode phân cực thuận thì dẫn, phân cực ngược thì chặn. A là tính chất của dây dẫn. C sai vì chiều thuận diode dẫn. D sai vì LED phát sáng nhờ dòng thuận.'
