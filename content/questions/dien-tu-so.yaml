- id: dtso-mcq-02
  type: mcq
  topicId: dien-tu-so
  subtopicId: cong-logic
  level: th
  skill: interpret-diagram
  stem: 'Xét cổng AND như hình vẽ. Với A = 1 và B = 0 thì ngõ ra Y bằng bao nhiêu?'
  media:
    - src: /assets/cong-and.svg
      alt: 'Ký hiệu cổng AND hai ngõ vào A, B ở cạnh trái thẳng và ngõ ra Y ở cạnh phải cong'
  mcq:
    options:
      - '0'
      - '1'
      - '2'
      - 'Không xác định'
    correct: A
  explanation: 'Đáp án A đúng: AND chỉ ra 1 khi cả hai vào đều 1; ở đây B = 0 nên Y = 0. C sai vì logic số chỉ có 0 và 1. D sai vì bảng chân trị xác định rõ.'
  source: { kind: original }
  status: draft
  version: 1
  tags: [seed, m2]
- id: dtso-mcq-03
