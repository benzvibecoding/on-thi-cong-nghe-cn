- id: dtso-mcq-04
  type: mcq
  topicId: dien-tu-so
  subtopicId: mach-to-hop
  level: vd
  skill: real-world
  stem: 'Chuông báo động của một phòng thí nghiệm chỉ kêu khi cửa mở (C = 1) VÀ hệ thống đã bật (H = 1). Nên dùng cổng logic nào?'
  mcq:
    options:
      - 'Cổng AND'
      - 'Cổng OR'
      - 'Cổng NOT'
      - 'Không dùng cổng logic nào'
    correct: A
  explanation: 'Đáp án A đúng vì yêu cầu cả hai điều kiện đồng thời. B sai vì OR kêu khi chỉ một điều kiện đúng. C chỉ đảo một tín hiệu. D sai vì đây đúng là bài toán tổ hợp.'
  source: { kind: original }
  status: draft
  version: 1
  tags: [seed, m2]
- id: dtso-tf4-01
  type: tf4
  topicId: dien-tu-so
  level: th
  stem: 'Cho các nhận định về mạch số. Xét tính đúng/sai của từng ý.'
  tf4:
    statements:
      - key: a
        text: 'Cổng OR ra mức 1 khi có ít nhất một ngõ vào bằng 1.'
        isTrue: true
        explanation: 'Đúng theo bảng chân trị cổng OR.'
      - key: b
        text: 'Trong phép toán logic OR, $1 + 1 = 1$.'
        isTrue: true
        explanation: 'Đúng: đây là cộng logic, không phải cộng số học.'
      - key: c
        text: 'Mạch tổ hợp có ngõ ra chỉ phụ thuộc tổ hợp ngõ vào ở hiện tại.'
        isTrue: true
        explanation: 'Đúng theo định nghĩa mạch tổ hợp.'
      - key: d
        text: 'Cổng AND hai ngõ vào ra mức 1 khi A = 1 và B = 0.'
        isTrue: false
        explanation: 'Sai: AND cần cả hai vào đều 1 mới ra 1.'
  explanation: 'Các ý a, b, c đúng; ý d sai.'
  source: { kind: original }
  status: draft
  version: 1
  tags: [seed, m2]
