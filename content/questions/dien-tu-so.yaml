  stem: 'Ngõ ra của cổng AND hai ngõ vào bằng 1 trong trường hợp nào?'
  mcq:
    options:
      - 'Khi tất cả các ngõ vào đều bằng 1'
      - 'Khi có ít nhất một ngõ vào bằng 1'
      - 'Khi tất cả các ngõ vào đều bằng 0'
      - 'Trong mọi trường hợp'
    correct: A
  explanation: 'Đáp án A đúng: $Y = A \\cdot B$. B là tính chất của cổng OR. C cho ra 0. D sai vì ngõ ra phụ thuộc ngõ vào.'
