  stem: 'Cổng NOT có chức năng gì?'
  mcq:
    options:
      - 'Đảo mức logic: vào 0 ra 1, vào 1 ra 0'
      - 'Cộng hai số nhị phân'
      - 'Khuếch đại tín hiệu tương tự'
      - 'Tích trữ điện năng'
