- id: ddc-tf4-03
  type: tf4
  topicId: dien-dai-cuong
  level: th
  stem: 'Cho các nhận định về kĩ thuật điện. Xét tính đúng/sai của từng ý.'
  tf4:
    statements:
      - key: a
        text: 'Kĩ thuật điện bao gồm sản xuất, truyền tải, phân phối và sử dụng điện năng.'
        isTrue: true
        explanation: 'Đúng theo khái niệm.'
      - key: b
        text: 'Vận hành nhà máy điện là một ngành nghề thuộc lĩnh vực kĩ thuật điện.'
        isTrue: true
        explanation: 'Đúng theo phân loại ngành nghề.'
      - key: c
        text: 'Kĩ thuật điện không liên quan gì đến tự động hóa sản xuất.'
        isTrue: false
        explanation: 'Sai: điện năng là nền tảng của tự động hóa.'
      - key: d
        text: 'Năng lượng tái tạo không thuộc phạm vi quan tâm của kĩ thuật điện.'
        isTrue: false
        explanation: 'Sai: thủy điện, điện gió, mặt trời đều là nguồn điện.'
  explanation: 'Các ý a, b đúng; c, d sai.'
  source: { kind: original }
  status: draft
  version: 1
  tags: [seed, dot-3]
