  level: nb
  skill: recall
  stem: 'RAM và flash trong vi điều khiển khác nhau ở điểm nào?'
  mcq:
    options:
      - 'RAM giữ dữ liệu khi mất nguồn, flash thì mất'
      - 'Flash giữ chương trình khi mất nguồn, RAM mất dữ liệu tạm khi mất nguồn'
      - 'Cả hai đều mất hết khi mất nguồn'
      - 'Cả hai đều không bao giờ mất dữ liệu'
    correct: B
  explanation: 'Đáp án B đúng. A đảo ngược. C sai vì flash không mất. D sai vì RAM mất khi mất nguồn.'
  source: { kind: original }
  status: draft
  version: 1
  tags: [seed, dot-2]
