- id: vdk-tf4-02
  type: tf4
  topicId: vi-dieu-khien
  level: nb
  stem: 'Cho các nhận định về vi điều khiển. Xét tính đúng/sai của từng ý.'
  tf4:
    statements:
      - key: a
        text: 'Flash lưu chương trình nên không mất khi mất nguồn.'
        isTrue: true
        explanation: 'Đúng với tính chất bộ nhớ flash.'
      - key: b
        text: 'RAM giữ nguyên dữ liệu tạm cả khi đã ngắt nguồn.'
        isTrue: false
        explanation: 'Sai: RAM mất dữ liệu khi mất nguồn.'
      - key: c
        text: 'Cổng vào/ra giúp vi điều khiển đọc cảm biến và điều khiển thiết bị.'
        isTrue: true
        explanation: 'Đúng theo cấu trúc vào – xử lý – ra.'
      - key: d
        text: 'Mọi thay đổi hành vi đều phải thay chip mới, không thể nạp lại.'
        isTrue: false
        explanation: 'Sai: chỉ cần sửa và nạp lại chương trình.'
  explanation: 'Các ý a, c đúng; b, d sai.'
  source: { kind: original }
  status: draft
  version: 1
  tags: [seed, dot-2]
