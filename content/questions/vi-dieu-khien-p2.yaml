  level: vd
  skill: troubleshoot
  stem: 'Đã nạp chương trình mới nhưng mạch vẫn chạy y như chương trình cũ. Nên kiểm tra gì đầu tiên?'
  mcq:
    options:
      - 'Màu vỏ hộp mạch'
      - 'Việc nạp có thật sự thành công không, rồi nhấn reset cho chạy lại'
      - 'Độ dài của dây USB'
      - 'Tên file chương trình có hay không'
    correct: B
  explanation: 'Đáp án B đúng: nạp lỗi hoặc chưa reset là nguyên nhân phổ biến nhất. A, C, D không ảnh hưởng hành vi chương trình.'
