  stem: 'Truyền cùng một công suất trên đường dây có điện trở không đổi. Nếu điện áp tăng gấp đôi thì dòng điện và hao phí thay đổi thế nào?'
  mcq:
    options:
      - 'Dòng giảm một nửa, hao phí giảm còn một phần tư'
      - 'Dòng tăng gấp đôi, hao phí tăng gấp đôi'
      - 'Dòng không đổi, hao phí giảm một nửa'
      - 'Dòng giảm một nửa, hao phí không đổi'
    correct: A
  explanation: 'Đáp án A đúng: $I = P/U$ nên I giảm nửa; $P_{hp} = I^2 R$ nên hao phí còn 1/4. Các đáp án còn lại tính sai quan hệ.'
  source: { kind: original }
  status: draft
  version: 1
  tags: [seed, dot-2]
