- id: htd-tf4-02
  type: tf4
  topicId: he-thong-dien-quoc-gia
  level: nb
  stem: 'Cho các nhận định về hệ thống điện quốc gia. Xét tính đúng/sai của từng ý.'
  tf4:
    statements:
      - key: a
        text: 'Điện gió và điện mặt trời là các nguồn điện trong hệ thống.'
        isTrue: true
        explanation: 'Đúng: nguồn tái tạo tham gia vào hệ thống điện.'
      - key: b
        text: 'Trạm biến áp chỉ có ở cuối đường dây, gần nơi tiêu thụ.'
        isTrue: false
        explanation: 'Sai: có trạm tăng áp ở đầu phát và trạm hạ áp ở đầu nhận.'
      - key: c
        text: 'Điện trở dây càng lớn thì hao phí tỏa nhiệt càng lớn.'
        isTrue: true
        explanation: 'Đúng theo $P_{hp} = I^2 \\cdot R$.'
      - key: d
        text: 'Người dùng sinh hoạt nhận điện trực tiếp ở điện áp truyền tải cao.'
        isTrue: false
        explanation: 'Sai: phải hạ áp qua nhiều cấp mới tới người dùng.'
  explanation: 'Các ý a, c đúng; b, d sai.'
  source: { kind: original }
  status: draft
  version: 1
  tags: [seed, dot-2]
