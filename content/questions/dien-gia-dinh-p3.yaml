  status: draft
  version: 1
  tags: [seed, dot-3]
- id: dgd-mcq-12
  type: mcq
  topicId: dien-gia-dinh
  subtopicId: thiet-bi-dong-cat
  level: vd
  skill: troubleshoot
  stem: 'Mạch đèn ngủ chỉ dùng bóng 60 W (dòng chưa tới 0,3 A) mà lắp aptomat 100 A. Vì sao không nên?'
  mcq:
    options:
      - 'Vì aptomat quá lớn sẽ không cắt khi quá tải nhỏ, mất tác dụng bảo vệ'
      - 'Vì aptomat lớn làm đèn sáng hơn'
      - 'Vì aptomat lớn tốn điện hơn'
      - 'Vì aptomat lớn không lắp vừa tủ điện'
    correct: A
  explanation: 'Đáp án A đúng: thiết bị bảo vệ phải phù hợp dòng mạch mới bảo vệ được. B sai vì aptomat không ảnh hưởng độ sáng. C sai vì aptomat không tiêu thụ đáng kể. D không phải lý do kĩ thuật chính.'
  source: { kind: original }
  status: draft
  version: 1
  tags: [seed, dot-3]
- id: dgd-tf4-03
  type: tf4
  topicId: dien-gia-dinh
  level: th
  stem: 'Cho các nhận định về thiết bị và mạch trong nhà. Xét tính đúng/sai của từng ý.'
  tf4:
    statements:
      - key: a
        text: 'Thông số định mức cho biết giá trị để thiết bị làm việc bình thường, an toàn.'
        isTrue: true
        explanation: 'Đúng theo khái niệm thông số định mức.'
      - key: b
        text: 'Mạch đèn cầu thang dùng hai công tắc 3 cực.'
        isTrue: true
        explanation: 'Đúng theo sơ đồ mạch cầu thang.'
      - key: c
        text: 'Sơ đồ lắp đặt thể hiện quan hệ điện, không cần đúng vị trí thực tế.'
        isTrue: false
        explanation: 'Sai: đó là mô tả của sơ đồ nguyên lí; sơ đồ lắp đặt phải đúng vị trí, cách đi dây.'
      - key: d
        text: 'Aptomat có dòng định mức càng lớn thì bảo vệ mạch nhỏ càng tốt.'
        isTrue: false
        explanation: 'Sai: quá lớn sẽ không cắt khi quá tải nhỏ.'
  explanation: 'Các ý a, b đúng; c, d sai.'
  source: { kind: original }
  status: draft
  version: 1
  tags: [seed, dot-3]
