  skill: recall
  stem: 'Sơ đồ nguyên lí và sơ đồ lắp đặt của hệ thống điện khác nhau ở điểm nào?'
  mcq:
    options:
      - 'Sơ đồ nguyên lí thể hiện quan hệ điện giữa các phần tử; sơ đồ lắp đặt thể hiện vị trí, cách đi dây thực tế'
      - 'Hai sơ đồ hoàn toàn giống nhau'
      - 'Sơ đồ nguyên lí chỉ vẽ cho vui'
      - 'Sơ đồ lắp đặt không cần đúng thực tế'
    correct: A
  explanation: 'Đáp án A đúng theo định nghĩa hai loại sơ đồ. B sai vì mục đích khác nhau. C, D sai ý nghĩa kĩ thuật.'
  source: { kind: original }
  status: draft
  version: 1
  tags: [seed, dot-3]
- id: dgd-mcq-11
