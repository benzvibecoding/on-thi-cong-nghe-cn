  stem: 'Mạch đèn cầu thang cho phép bật/tắt một bóng từ hai nơi khác nhau dùng loại công tắc nào?'
  mcq:
    options:
      - 'Hai công tắc 3 cực'
      - 'Một công tắc thường duy nhất'
      - 'Hai cầu chì'
      - 'Hai ổ cắm'
