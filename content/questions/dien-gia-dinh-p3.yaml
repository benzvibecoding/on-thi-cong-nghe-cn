  subtopicId: thiet-bi-dien
  level: nb
  skill: recall
  stem: 'Trên vỏ cầu dao điện có ghi "30 A – 250 V". Ý nghĩa của các thông số này là gì?'
  mcq:
    options:
      - 'Dòng điện định mức 30 A và điện áp định mức 250 V'
      - 'Dòng điện ngắn mạch 30 A và điện áp tối đa 250 V'
      - 'Dòng điện quá tải 30 A và điện áp tối thiểu 250 V'
      - 'Công suất 30 W và điện áp 250 V'
    correct: A
  explanation: 'Đáp án A đúng: đây là giá trị định mức để thiết bị làm việc bình thường, an toàn. B, C hiểu sai bản chất định mức. D sai đơn vị (A là dòng, không phải công suất).'
  source: { kind: original }
  status: draft
  version: 1
  tags: [seed, dot-3]
- id: dgd-mcq-10
