- id: attk-tf4-02
  type: tf4
  topicId: an-toan-tiet-kiem
  level: nb
  stem: 'Cho các nhận định về an toàn điện. Xét tính đúng/sai của từng ý.'
  tf4:
    statements:
      - key: a
        text: 'Nơi ẩm ướt nên dùng thiết bị chống giật chuyên dụng.'
        isTrue: true
        explanation: 'Đúng vì nước dẫn điện, nguy cơ giật cao.'
      - key: b
        text: 'Được phép tự ý leo cột điện để mắc nhờ điện.'
        isTrue: false
        explanation: 'Sai và vi phạm pháp luật, cực kỳ nguy hiểm.'
      - key: c
        text: 'Trước khi thay bóng đèn nên ngắt nguồn mạch đó.'
        isTrue: true
        explanation: 'Đúng theo nguyên tắc ngắt nguồn trước khi sửa.'
      - key: d
        text: 'Dùng điện tiết kiệm cũng góp phần giảm quá tải lưới điện.'
        isTrue: true
        explanation: 'Đúng: phụ tải giảm thì lưới bớt quá tải.'
  explanation: 'Ý b sai; các ý a, c, d đúng.'
  source: { kind: original }
  status: draft
  version: 1
  tags: [seed, dot-2]
