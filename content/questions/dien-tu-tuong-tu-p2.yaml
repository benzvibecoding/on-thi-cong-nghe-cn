- id: dttt-tf4-02
  type: tf4
  topicId: dien-tu-tuong-tu
  level: nb
  stem: 'Cho các nhận định về nguồn một chiều. Xét tính đúng/sai của từng ý.'
  tf4:
    statements:
      - key: a
        text: 'Khối hạ áp giảm điện áp xoay chiều xuống mức cần thiết.'
        isTrue: true
        explanation: 'Đúng theo chức năng khối hạ áp.'
      - key: b
        text: 'Khối chỉnh lưu dùng diode để tạo dòng một chiều nhấp nhô.'
        isTrue: true
        explanation: 'Đúng với nguyên lý chỉnh lưu.'
      - key: c
        text: 'Bỏ khối ổn áp thì điện áp ra vẫn luôn ổn định.'
        isTrue: false
        explanation: 'Sai: thiếu ổn áp, điện áp ra thay đổi theo tải và lưới.'
      - key: d
        text: 'Khuếch đại làm méo hoàn toàn dạng sóng của tín hiệu vào.'
        isTrue: false
        explanation: 'Sai: khuếch đại tốt giữ nguyên dạng sóng.'
  explanation: 'Các ý a, b đúng; c, d sai.'
