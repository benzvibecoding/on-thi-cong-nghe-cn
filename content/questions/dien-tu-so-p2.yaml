- id: dtso-tf4-02
  type: tf4
  topicId: dien-tu-so
  level: nb
  stem: 'Cho các nhận định về cổng logic. Xét tính đúng/sai của từng ý.'
  tf4:
    statements:
      - key: a
        text: 'Cổng NOT hai lần liên tiếp cho ra đúng mức logic ban đầu.'
        isTrue: true
        explanation: 'Đúng: đảo hai lần thì trở về như cũ.'
      - key: b
        text: 'Cổng OR hai ngõ vào ra 0 khi A = 0 và B = 0.'
        isTrue: true
        explanation: 'Đúng theo bảng chân trị.'
      - key: c
        text: 'Trong logic số, $1 + 1 = 2$.'
        isTrue: false
        explanation: 'Sai: đây là cộng logic OR nên $1 + 1 = 1$.'
      - key: d
        text: 'Cổng AND ba ngõ vào ra 1 khi chỉ một ngõ vào bằng 1.'
        isTrue: false
        explanation: 'Sai: cần cả ba ngõ vào đều 1.'
  explanation: 'Các ý a, b đúng; c, d sai.'
  source: { kind: original }
  status: draft
  version: 1
  tags: [seed, dot-2]
