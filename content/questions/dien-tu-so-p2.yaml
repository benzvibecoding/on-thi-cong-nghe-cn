  topicId: dien-tu-so
  subtopicId: cong-logic
  level: vd
  skill: recall
  stem: 'Cổng AND ba ngõ vào ra mức 1 trong trường hợp nào?'
  mcq:
    options:
      - 'Khi cả ba ngõ vào đều bằng 1'
      - 'Khi có ít nhất một ngõ vào bằng 1'
      - 'Khi đúng hai ngõ vào bằng 1'
      - 'Khi cả ba ngõ vào đều bằng 0'
    correct: A
  explanation: 'Đáp án A đúng: AND ra 1 chỉ khi TẤT CẢ vào đều 1. B là tính chất OR. C và D cho ra 0.'
