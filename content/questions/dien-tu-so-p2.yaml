  topicId: dien-tu-so
  subtopicId: cong-logic
  level: th
  skill: interpret-diagram
  stem: 'Xét cổng OR như hình vẽ. Với A = 0 và B = 1 thì ngõ ra Y bằng bao nhiêu?'
  media:
    - src: /assets/cong-or.svg
      alt: 'Ký hiệu cổng OR hai ngõ vào A, B ở cạnh trái cong lõm và ngõ ra Y ở cạnh phải cong lồi'
  mcq:
    options:
      - '0'
      - '1'
      - '2'
      - 'Không xác định'
    correct: B
  explanation: 'Đáp án B đúng: OR ra 1 khi có ít nhất một vào là 1. C sai vì logic số chỉ có 0 và 1. D sai vì bảng chân trị xác định rõ.'
  source: { kind: original }
  status: draft
  version: 1
  tags: [seed, dot-2]
