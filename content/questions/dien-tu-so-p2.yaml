  stem: 'Ngõ ra của cổng OR hai ngõ vào bằng 0 trong trường hợp nào?'
  mcq:
    options:
      - 'Khi cả hai ngõ vào đều bằng 0'
      - 'Khi có ít nhất một ngõ vào bằng 1'
      - 'Khi cả hai ngõ vào đều bằng 1'
      - 'Trong mọi trường hợp'
    correct: A
  explanation: 'Đáp án A đúng: $Y = A + B$, chỉ 0 + 0 mới ra 0. B ra 1. C ra 1. D sai vì ngõ ra phụ thuộc ngõ vào.'
