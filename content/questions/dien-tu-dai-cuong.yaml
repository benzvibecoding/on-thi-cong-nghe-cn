- id: dtdc-tf4-01
  type: tf4
  topicId: dien-tu-dai-cuong
  level: th
  stem: 'Cho các nhận định về kĩ thuật điện tử. Xét tính đúng/sai của từng ý.'
  tf4:
    statements:
      - key: a
        text: 'Kĩ thuật điện chủ yếu về năng lượng công suất lớn, điện tử chủ yếu về tín hiệu và điều khiển.'
        isTrue: true
        explanation: 'Đúng theo sự phân công của hai lĩnh vực.'
      - key: b
        text: 'Tín hiệu số trong máy tính thường dùng hai mức 0 và 1.'
        isTrue: true
        explanation: 'Đúng: mức thấp và mức cao của logic số.'
      - key: c
        text: 'Tiếng nói từ micro là ví dụ của tín hiệu tương tự.'
        isTrue: true
        explanation: 'Đúng: âm thanh biến thiên liên tục theo thời gian.'
      - key: d
        text: 'Mạch điện tử không có mặt trong các thiết bị gia dụng.'
        isTrue: false
        explanation: 'Sai: điều hòa, máy giặt, nồi cơm điện hiện đại đều có mạch điện tử.'
  explanation: 'Các ý a, b, c đúng; ý d sai.'
  source: { kind: original }
  status: draft
  version: 1
  tags: [seed, m2]
