- id: dtdc-tf4-02
  type: tf4
  topicId: dien-tu-dai-cuong
  level: nb
  stem: 'Cho các nhận định về tín hiệu. Xét tính đúng/sai của từng ý.'
  tf4:
    statements:
      - key: a
        text: 'Micro biến âm thanh thành tín hiệu điện.'
        isTrue: true
        explanation: 'Đúng theo chức năng của micro.'
      - key: b
        text: 'Loa biến tín hiệu điện thành âm thanh.'
        isTrue: true
        explanation: 'Đúng theo chức năng của loa.'
      - key: c
        text: 'Tín hiệu từ nút nhấn đóng/ngắt là tín hiệu tương tự.'
        isTrue: false
        explanation: 'Sai: chỉ hai trạng thái rời rạc nên là tín hiệu số.'
      - key: d
        text: 'Máy tính xử lý trực tiếp tín hiệu tương tự mà không cần đổi dạng.'
        isTrue: false
        explanation: 'Sai: phải đổi sang tín hiệu số máy tính mới xử lý được.'
  explanation: 'Các ý a, b đúng; c, d sai.'
