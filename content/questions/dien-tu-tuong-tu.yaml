  level: nb
  skill: recall
  stem: 'Trong nguồn một chiều, khối nào biến điện xoay chiều thành điện một chiều nhấp nhô?'
  mcq:
    options:
      - 'Khối hạ áp'
      - 'Khối chỉnh lưu'
      - 'Khối lọc'
      - 'Khối ổn áp'
    correct: B
  explanation: 'Đáp án B đúng: diode chỉnh lưu đổi chiều dòng thành một chiều nhấp nhô. Hạ áp giảm mức áp, lọc làm phẳng, ổn áp giữ áp ra ổn định.'
  source: { kind: original }
