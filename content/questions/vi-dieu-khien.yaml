- id: vdk-tf4-01
  type: tf4
  topicId: vi-dieu-khien
  level: th
  stem: 'Cho các nhận định về vi điều khiển. Xét tính đúng/sai của từng ý.'
  tf4:
    statements:
      - key: a
        text: 'Vi điều khiển chạy một chương trình chuyên dụng cho bài toán điều khiển cụ thể.'
        isTrue: true
        explanation: 'Đúng với bản chất điều khiển nhúng.'
      - key: b
        text: 'Vi điều khiển và máy tính cá nhân là một, không có gì khác nhau.'
        isTrue: false
        explanation: 'Sai: vi điều khiển tài nguyên nhỏ, chuyên điều khiển nhúng.'
      - key: c
        text: 'Muốn đổi hành vi của hệ thống dùng vi điều khiển, ta sửa và nạp lại chương trình.'
        isTrue: true
        explanation: 'Đúng: linh hoạt nhờ lập trình lại.'
      - key: d
        text: 'Cảm biến đưa tín hiệu vào, cơ cấu chấp hành thực hiện lệnh ra.'
        isTrue: true
        explanation: 'Đúng theo luồng vào – xử lý – ra.'
  explanation: 'Các ý a, c, d đúng; ý b sai.'
  source: { kind: original }
  status: draft
  version: 1
  tags: [seed, m2]
